<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قطة حبيبة بابا</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f9e1e9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* خلفية القلوب المتساقطة - مخففة */
        #hearts-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .heart {
            position: absolute;
            top: -50px;
            color: rgba(255, 105, 180, 0.5);
            font-size: 18px;
            user-select: none;
            pointer-events: none;
        }
        
        /* الإطار الرئيسي */
        .main-frame {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
            width: 90%;
            max-width: 500px;
            height: 800px;
            padding: 20px;
            text-align: center;
            z-index: 10;
            border: 1px solid rgba(255, 182, 193, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: background-color 0.5s ease, box-shadow 0.5s ease, border 0.5s ease;
        }
        
        /* عندما يكون المعرض نشطاً، نخفي الإطار */
        .main-frame.gallery-active {
            background-color: transparent;
            box-shadow: none;
            border: none;
        }
        
        /* واجهة تسجيل الدخول */
        .login-section {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            transition: opacity 0.5s ease;
        }
        
        .login-section.hidden {
            opacity: 0;
            display: none;
        }
        
        .login-header {
            margin-bottom: 30px;
            padding-top: 20px;
        }
        
        .login-header h1 {
            color: #ff69b4;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .login-header p {
            color: #888;
            font-size: 16px;
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 25px;
            flex: 1;
            justify-content: center;
        }
        
        .password-container {
            position: relative;
        }
        
        .password-container input {
            width: 100%;
            padding: 15px 20px;
            padding-left: 50px;
            border: 2px solid #ffc0cb;
            border-radius: 12px;
            font-size: 16px;
            background-color: #fff;
            color: #333;
            transition: all 0.3s;
        }
        
        .password-container input:focus {
            outline: none;
            border-color: #ff69b4;
            box-shadow: 0 0 0 3px rgba(255, 105, 180, 0.2);
        }
        
        .password-container i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff69b4;
            font-size: 18px;
        }
        
        .login-btn {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 5px;
        }
        
        .login-btn:hover {
            background-color: #ff1493;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 105, 180, 0.4);
        }
        
        .error-message {
            color: #ff4757;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        /* خانت التوجيهات */
        .password-hint {
            background-color: rgba(255, 240, 245, 0.9);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            border: 1px dashed #ff69b4;
            position: relative;
        }
        
        .password-hint p {
            color: #d63384;
            font-size: 15px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .sticker-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
        }
        
        .sticker {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid #ff69b4;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1);
        }
        
        .password-note {
            color: #ff69b4;
            font-size: 14px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        /* واجهة المعرض بدون إطار */
        .gallery-section {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .gallery-section.active {
            display: flex;
            opacity: 1;
        }
        
        /* رأس المعرض - شفاف */
        .gallery-header {
            padding: 10px 0;
            z-index: 20;
            flex-shrink: 0;
        }
        
        .gallery-header h2 {
            color: #ff69b4;
            font-size: 24px;
            font-weight: 600;
        }
        
        /* مربع الصور - مبسط */
        .image-gallery {
            width: 100%;
            flex: 1;
            position: relative;
            cursor: grab;
            touch-action: pan-y;
            padding: 5px;
            margin: 10px 0;
        }
        
        .image-gallery:active {
            cursor: grabbing;
        }
        
        .image-stack {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.3s ease;
        }
        
        /* الصورة الرئيسية */
        .image-item {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, opacity 0.3s ease, filter 0.3s ease;
            backface-visibility: hidden;
            transform-origin: center center;
        }
        
        .image-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
        }
        
        .counter {
            color: #ff69b4;
            font-size: 18px;
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            z-index: 20;
            margin: 10px 0;
            flex-shrink: 0;
        }
        
        .instructions {
            color: #ff69b4;
            font-size: 14px;
            text-align: center;
            padding: 8px 15px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            margin: 10px 0;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        
        /* زر العودة */
        .back-button {
            background-color: #ffc0cb;
            color: #ff69b4;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            align-self: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        
        .back-button:hover {
            background-color: #ff69b4;
            color: white;
        }
        
        /* التكيف مع الشاشات الصغيرة */
        @media (max-width: 768px) {
            .main-frame {
                height: 700px;
                max-width: 450px;
            }
            
            .login-header h1 {
                font-size: 24px;
            }
        }
        
        @media (max-width: 480px) {
            .main-frame {
                height: 650px;
                max-width: 380px;
                padding: 15px;
            }
            
            .login-header h1 {
                font-size: 22px;
            }
            
            .gallery-header h2 {
                font-size: 20px;
            }
        }
        
        /* تأثيرات بسيطة */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }
        
        .login-btn {
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>
    <!-- خلفية القلوب المتساقطة -->
    <div id="hearts-background"></div>
    
    <!-- الإطار الرئيسي -->
    <div class="main-frame" id="mainFrame">
        <!-- قسم تسجيل الدخول -->
        <div class="login-section" id="loginSection">
            <div class="login-header">
                <h1>نورتي يحبيبة بابا💕💕😔</h1>
                <p>دخلي الباسورد يقطة</p>
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="password-container">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="الباسورد" required>
                </div>
                
                <div class="error-message" id="errorMessage">كلمة المرور غير صحيحة. حاول مرة أخرى.</div>
                
                <button type="submit" class="login-btn">دخول</button>
                
                <!-- خانة التوجيهات -->
                <div class="password-hint">
                    <p>الباسورد: <strong>بحبك يحمودي</strong></p>
                    <div class="sticker-container">
                        <img src="sticker.jpg" alt="Sticker" class="sticker">
                    </div>
                    <div class="password-note">
                        <span>كاتب الباسورد كد عشان تفضلي تكتبي بحبك يحمودي</span>
                        <span>😂</span>
                    </div>
                </div>
            </form>
        </div>
        
        <!-- قسم المعرض بدون إطار -->
        <div class="gallery-section" id="gallerySection">
            <div class="gallery-header">
                <h2>بحبك</h2>
            </div>
            
            <div class="image-gallery" id="imageGallery">
                <div class="image-stack" id="imageStack">
                    <!-- سيتم إضافة الصور ديناميكياً -->
                </div>
            </div>
            
            <div class="counter">
                <span id="currentImage">1</span> / <span id="totalImages">18</span>
            </div>
            
            <div class="instructions">
                بحبك يا اجمل حاجة حصلتلي ربنا يخليكي ليا💑
            </div>
            
            <button class="back-button" id="backButton">
                <i class="fas fa-arrow-right"></i> العودة لصفحة الاولة
            </button>
        </div>
    </div>
    
    <!-- عنصر الصوت (سيتم إخفاؤه) -->
    <audio id="backgroundMusic" loop preload="metadata">
        <source src="adiuo.mp3" type="audio/mpeg">
        المتصفح الخاص بك لا يدعم تشغيل الصوت.
    </audio>

    <script>
        // كلمة المرور الصحيحة
        const CORRECT_PASSWORD = "بحبك يحمودي";
        
        // عناصر DOM
        const mainFrame = document.getElementById('mainFrame');
        const loginSection = document.getElementById('loginSection');
        const gallerySection = document.getElementById('gallerySection');
        const loginForm = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        const backgroundMusic = document.getElementById('backgroundMusic');
        const imageStack = document.getElementById('imageStack');
        const currentImageSpan = document.getElementById('currentImage');
        const totalImagesSpan = document.getElementById('totalImages');
        const imageGallery = document.getElementById('imageGallery');
        const heartsBackground = document.getElementById('hearts-background');
        const backButton = document.getElementById('backButton');
        
        // عدد الصور - غيرنا إلى 18 فقط
        const TOTAL_IMAGES = 18;
        totalImagesSpan.textContent = TOTAL_IMAGES;
        
        // الصورة الحالية
        let currentImageIndex = 1;
        let isDragging = false;
        let startX = 0;
        let currentX = 0;
        let heartsInterval = null;
        let autoSlideInterval = null;
        let isAutoSliding = true;
        let isUserInteracting = false;
        
        // نظام القلوب المتساقطة - مبسط
        function initHearts() {
            heartsInterval = setInterval(() => {
                createHeart();
            }, 800);
        }
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            
            const left = Math.random() * 100;
            const size = Math.random() * 12 + 10;
            
            heart.style.left = `${left}%`;
            heart.style.fontSize = `${size}px`;
            
            heartsBackground.appendChild(heart);
            
            let top = -50;
            const speed = 0.5 + Math.random() * 0.3;
            const duration = 10000;
            
            const startTime = Date.now();
            
            function moveHeart() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                top = -50 + (progress * (window.innerHeight + 100));
                heart.style.top = `${top}px`;
                
                const swing = Math.sin(progress * Math.PI * 2) * 5;
                heart.style.transform = `translateX(${swing}px) rotate(${progress * 180}deg)`;
                
                heart.style.opacity = 1 - progress * 0.8;
                
                if (progress < 1) {
                    requestAnimationFrame(moveHeart);
                } else {
                    heart.remove();
                }
            }
            
            requestAnimationFrame(moveHeart);
            
            if (heartsBackground.children.length > 15) {
                const oldHearts = heartsBackground.querySelectorAll('.heart');
                if (oldHearts.length > 0) {
                    oldHearts[0].remove();
                }
            }
        }
        
        // نظام التمرير التلقائي
        function startAutoSlide() {
            if (autoSlideInterval) clearInterval(autoSlideInterval);
            
            autoSlideInterval = setInterval(() => {
                if (!isUserInteracting && isAutoSliding && gallerySection.classList.contains('active')) {
                    changeImage(1);
                }
            }, 2000); // كل ثانيتين
        }
        
        function stopAutoSlide() {
            if (autoSlideInterval) {
                clearInterval(autoSlideInterval);
                autoSlideInterval = null;
            }
        }
        
        // إنشاء معرض الصور
        function createImageGallery() {
            imageStack.innerHTML = '';
            
            // تحميل الصور من 1 إلى 18 فقط
            for (let i = 1; i <= TOTAL_IMAGES; i++) {
                loadImage(i);
            }
            
            updateImagePosition();
            
            // بدء التمرير التلقائي
            startAutoSlide();
        }
        
        // تحميل صورة واحدة
        function loadImage(index) {
            if (index < 1 || index > TOTAL_IMAGES) return;
            
            const imageItem = document.createElement('div');
            imageItem.classList.add('image-item');
            imageItem.dataset.index = index;
            
            const img = new Image();
            img.src = `image${index}.jpg`;
            img.alt = `صورة ${index}`;
            img.loading = "eager";
            
            img.onload = function() {
                imageItem.appendChild(img);
                imageStack.appendChild(imageItem);
                
                // أحداث للتوقف عند التفاعل
                imageItem.addEventListener('touchstart', handleInteractionStart);
                imageItem.addEventListener('mousedown', handleInteractionStart);
                imageItem.addEventListener('touchend', handleInteractionEnd);
                imageItem.addEventListener('mouseup', handleInteractionEnd);
                imageItem.addEventListener('mouseleave', handleInteractionEnd);
            };
        }
        
        // بدء التفاعل مع الصورة
        function handleInteractionStart() {
            isUserInteracting = true;
            stopAutoSlide();
        }
        
        // انتهاء التفاعل مع الصورة
        function handleInteractionEnd() {
            isUserInteracting = false;
            
            // إعادة تشغيل التمرير التلقائي بعد 1 ثانية من ترك المستخدم للصورة
            setTimeout(() => {
                if (!isUserInteracting) {
                    startAutoSlide();
                }
            }, 1000);
        }
        
        // تحديث موقع الصور
        function updateImagePosition() {
            const imageItems = document.querySelectorAll('.image-item');
            
            imageItems.forEach((item) => {
                const itemIndex = parseInt(item.dataset.index);
                const distance = Math.abs(currentImageIndex - itemIndex);
                
                if (itemIndex === currentImageIndex) {
                    item.style.transform = 'scale(1)';
                    item.style.zIndex = '10';
                    item.style.opacity = '1';
                    item.style.filter = 'none';
                } else if (itemIndex < currentImageIndex) {
                    item.style.transform = `translateX(-${distance * 30}px) scale(${1 - distance * 0.1})`;
                    item.style.zIndex = (9 - distance).toString();
                    item.style.opacity = (0.8 - distance * 0.2).toString();
                    item.style.filter = `blur(${distance}px)`;
                } else {
                    item.style.transform = `translateX(${distance * 30}px) scale(${1 - distance * 0.1})`;
                    item.style.zIndex = (9 - distance).toString();
                    item.style.opacity = (0.8 - distance * 0.2).toString();
                    item.style.filter = `blur(${distance}px)`;
                }
            });
            
            currentImageSpan.textContent = currentImageIndex;
        }
        
        // تغيير الصورة
        function changeImage(direction) {
            const oldIndex = currentImageIndex;
            currentImageIndex += direction;
            
            if (currentImageIndex < 1) {
                currentImageIndex = TOTAL_IMAGES;
            } else if (currentImageIndex > TOTAL_IMAGES) {
                currentImageIndex = 1;
            }
            
            updateImagePosition();
        }
        
        // معالجة تسجيل الدخول
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const enteredPassword = passwordInput.value.trim();
            
            if (enteredPassword === CORRECT_PASSWORD) {
                errorMessage.style.display = 'none';
                
                backgroundMusic.load();
                
                loginSection.classList.add('hidden');
                mainFrame.classList.add('gallery-active');
                
                setTimeout(() => {
                    gallerySection.classList.add('active');
                    createImageGallery();
                    
                    setTimeout(() => {
                        backgroundMusic.play().catch(e => {
                            console.log("سيتم تشغيل الموسيقى يدوياً");
                        });
                    }, 500);
                }, 300);
            } else {
                errorMessage.style.display = 'block';
                passwordInput.focus();
                
                loginForm.style.animation = 'shake 0.3s';
                setTimeout(() => {
                    loginForm.style.animation = '';
                }, 300);
            }
        });
        
        // زر العودة
        backButton.addEventListener('click', function() {
            stopAutoSlide();
            gallerySection.classList.remove('active');
            mainFrame.classList.remove('gallery-active');
            
            setTimeout(() => {
                loginSection.classList.remove('hidden');
                backgroundMusic.pause();
                backgroundMusic.currentTime = 0;
                passwordInput.value = '';
                passwordInput.focus();
                
                imageStack.innerHTML = '';
            }, 300);
        });
        
        // التحكم في الصور بالسحب
        let dragStartX = 0;
        let dragDistance = 0;
        let isTouchDevice = 'ontouchstart' in window;
        
        if (isTouchDevice) {
            imageGallery.addEventListener('touchstart', function(e) {
                isUserInteracting = true;
                stopAutoSlide();
                dragStartX = e.touches[0].clientX;
                dragDistance = 0;
            });
            
            imageGallery.addEventListener('touchmove', function(e) {
                dragDistance = e.touches[0].clientX - dragStartX;
            });
            
            imageGallery.addEventListener('touchend', function() {
                if (Math.abs(dragDistance) > 50) {
                    if (dragDistance > 0) {
                        changeImage(-1);
                    } else {
                        changeImage(1);
                    }
                }
                dragDistance = 0;
                
                // إعادة التشغيل بعد ثانية
                setTimeout(() => {
                    isUserInteracting = false;
                    startAutoSlide();
                }, 1000);
            });
        } else {
            imageGallery.addEventListener('mousedown', function(e) {
                isUserInteracting = true;
                stopAutoSlide();
                dragStartX = e.clientX;
                dragDistance = 0;
                imageGallery.style.cursor = 'grabbing';
            });
            
            imageGallery.addEventListener('mousemove', function(e) {
                if (dragStartX !== 0) {
                    dragDistance = e.clientX - dragStartX;
                }
            });
            
            imageGallery.addEventListener('mouseup', function() {
                if (Math.abs(dragDistance) > 50) {
                    if (dragDistance > 0) {
                        changeImage(-1);
                    } else {
                        changeImage(1);
                    }
                }
                dragStartX = 0;
                dragDistance = 0;
                imageGallery.style.cursor = 'grab';
                
                // إعادة التشغيل بعد ثانية
                setTimeout(() => {
                    isUserInteracting = false;
                    startAutoSlide();
                }, 1000);
            });
            
            imageGallery.addEventListener('mouseleave', function() {
                if (dragStartX !== 0) {
                    isUserInteracting = false;
                    startAutoSlide();
                }
                dragStartX = 0;
                dragDistance = 0;
                imageGallery.style.cursor = 'grab';
            });
            
            // أسهم الكيبورد
            document.addEventListener('keydown', function(e) {
                if (gallerySection.classList.contains('active')) {
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        isUserInteracting = true;
                        stopAutoSlide();
                        changeImage(1);
                        
                        setTimeout(() => {
                            isUserInteracting = false;
                            startAutoSlide();
                        }, 1000);
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        isUserInteracting = true;
                        stopAutoSlide();
                        changeImage(-1);
                        
                        setTimeout(() => {
                            isUserInteracting = false;
                            startAutoSlide();
                        }, 1000);
                    }
                }
            });
        }
        
        // بدء تشغيل الخلفية
        window.addEventListener('DOMContentLoaded', () => {
            initHearts();
            passwordInput.focus();
        });
        
        // تنظيف الموارد
        window.addEventListener('beforeunload', () => {
            clearInterval(heartsInterval);
            stopAutoSlide();
            heartsBackground.innerHTML = '';
        });
    </script>
</body>
</html>
