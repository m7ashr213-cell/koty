<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ماما الصغننة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: #f9e1e9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }
        
        /* خلفية القلوب المتساقطة - مخففة */
        #hearts-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .heart {
            position: absolute;
            top: -50px;
            color: rgba(255, 105, 180, 0.5);
            font-size: 18px;
            user-select: none;
            pointer-events: none;
        }
        
        /* الإطار الرئيسي */
        .main-frame {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.2);
            width: 90%;
            max-width: 500px;
            height: 850px;
            padding: 20px;
            text-align: center;
            z-index: 10;
            border: 1px solid rgba(255, 182, 193, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            transition: background-color 0.5s ease, box-shadow 0.5s ease, border 0.5s ease;
        }
        
        /* عندما يكون المعرض نشطاً، نخفي الإطار */
        .main-frame.gallery-active {
            background-color: transparent;
            box-shadow: none;
            border: none;
            overflow-y: auto;
            height: 100vh;
            max-height: 100vh;
            max-width: 100%;
            border-radius: 0;
        }
        
        /* إخفاء شريط التمرير */
        .main-frame.gallery-active::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }
        
        .main-frame.gallery-active {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        
        /* واجهة تسجيل الدخول الجديدة */
        .login-section {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            transition: opacity 0.5s ease;
            justify-content: center;
            align-items: center;
        }
        
        .login-section.hidden {
            opacity: 0;
            display: none;
        }
        
        .login-header {
            margin-bottom: 40px;
            width: 100%;
        }
        
        .login-gif {
            width: 300px;
            height: 300px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 25px;
            border: 3px solid #ff69b4;
            box-shadow: 0 10px 20px rgba(255, 105, 180, 0.3);
        }
        
        .login-question {
            color: #ff69b4;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 40px;
            text-align: center;
            line-height: 1.5;
        }
        
        /* أزرار الاختيار */
        .buttons-container {
            display: flex;
            gap: 30px;
            margin-top: 20px;
            position: relative;
            width: 100%;
            justify-content: center;
            transition: all 0.5s ease;
        }
        
        .yes-btn, .no-btn {
            padding: 18px 35px;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 150px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            position: relative;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        .yes-btn {
            background-color: #4CAF50;
            color: white;
            transition: all 0.5s ease;
        }
        
        .yes-btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.4);
        }
        
        .no-btn {
            background-color: #ff4757;
            color: white;
            transition: all 0.3s ease;
        }
        
        .no-btn:hover {
            background-color: '#ff3742';
        }
        
        /* واجهة المعرض بدون إطار */
        .gallery-section {
            display: none;
            flex-direction: column;
            width: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
            min-height: 100vh;
        }
        
        .gallery-section.active {
            display: flex;
            opacity: 1;
        }
        
        /* رأس المعرض - مع الصورة الجديدة */
        .gallery-header {
            padding: 15px 0;
            z-index: 20;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgba(255, 255, 255, 0.9);
            width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .hug-gif {
            width: 180px;
            height: 180px;
            border-radius: 15px;
            object-fit: cover;
            margin-bottom: 10px;
            border: 3px solid #ff69b4;
            box-shadow: 0 8px 15px rgba(255, 105, 180, 0.3);
        }
        
        .gallery-header h2 {
            color: #ff69b4;
            font-size: 22px;
            font-weight: 600;
        }
        
        /* حاوية كل الصور - الطويلة */
        .image-gallery-container {
            width: 100%;
            position: relative;
            overflow: visible;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
        }
        
        /* قائمة الصور العمودية الطويلة */
        .image-gallery {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        /* كل صورة فردية - بنسبة 9:16 */
        .gallery-image-item {
            width: 100%;
            max-width: 450px;
            height: 800px; /* 450 * 1280/720 = 800 */
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            background-color: #000;
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
        }
        
        /* الصور تظهر بنفس النظام القديم */
        .gallery-image-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 15px;
            pointer-events: none;
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            background-color: #000;
        }
        
        .counter {
            color: #ff69b4;
            font-size: 18px;
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 8px 18px;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            z-index: 20;
            margin: 15px 0;
            flex-shrink: 0;
        }
        
        /* زر العودة */
        .back-button {
            background-color: #ffc0cb;
            color: #ff69b4;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 20px 0;
            align-self: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            position: sticky;
            bottom: 20px;
            z-index: 100;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        .back-button:hover {
            background-color: #ff69b4;
            color: white;
        }
        
        /* التكيف مع الشاشات الصغيرة */
        @media (max-width: 768px) {
            .main-frame {
                height: 800px;
                max-width: 450px;
            }
            
            .login-gif {
                width: 250px;
                height: 250px;
            }
            
            .login-question {
                font-size: 22px;
            }
            
            .buttons-container {
                gap: 20px;
            }
            
            .yes-btn, .no-btn {
                padding: 15px 30px;
                font-size: 18px;
                min-width: 130px;
            }
            
            .hug-gif {
                width: 160px;
                height: 160px;
            }
            
            .gallery-header h2 {
                font-size: 20px;
            }
            
            .gallery-image-item {
                max-width: 400px;
                height: 711px; /* 400 * 1280/720 = 711 */
            }
        }
        
        @media (max-width: 480px) {
            .main-frame {
                height: 750px;
                max-width: 380px;
                padding: 15px;
            }
            
            .login-gif {
                width: 220px;
                height: 220px;
            }
            
            .login-question {
                font-size: 20px;
                margin-bottom: 30px;
            }
            
            .buttons-container {
                flex-direction: column;
                align-items: center;
                gap: 15px;
            }
            
            .yes-btn, .no-btn {
                width: 80%;
                padding: 12px 20px;
                font-size: 18px;
            }
            
            .hug-gif {
                width: 140px;
                height: 140px;
            }
            
            .gallery-header h2 {
                font-size: 18px;
            }
            
            .counter {
                font-size: 16px;
                padding: 7px 15px;
            }
            
            .back-button {
                padding: 10px 20px;
                font-size: 14px;
            }
            
            .gallery-image-item {
                max-width: 350px;
                height: 622px; /* 350 * 1280/720 = 622 */
            }
        }
        
        @media (max-width: 380px) {
            .gallery-image-item {
                max-width: 320px;
                height: 569px; /* 320 * 1280/720 = 569 */
            }
        }
        
        /* تأثيرات بسيطة */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .yes-btn {
            animation: float 2s ease-in-out infinite;
        }
        
        @keyframes moveRandom {
            0% { transform: translate(0, 0); }
            25% { transform: translate(50px, 30px); }
            50% { transform: translate(-40px, 60px); }
            75% { transform: translate(60px, -30px); }
            100% { transform: translate(-20px, 40px); }
        }
        
        .no-btn.moving {
            animation: moveRandom 0.8s ease-in-out;
        }
        
        /* تصميم الهامش السفلي للصفحة */
        .page-footer {
            width: 100%;
            padding: 20px;
            text-align: center;
            color: #ff69b4;
            font-size: 14px;
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <!-- خلفية القلوب المتساقطة -->
    <div id="hearts-background"></div>
    
    <!-- الإطار الرئيسي -->
    <div class="main-frame" id="mainFrame">
        <!-- قسم تسجيل الدخول الجديد -->
        <div class="login-section" id="loginSection">
            <div class="login-header">
                <img src="milk-and-mocha.gif" alt="Milk and Mocha" class="login-gif">
                <p class="login-question">ماما ماما ماما ماما انتي بتحبيني ولا لا</p>
            </div>
            
            <div class="buttons-container" id="buttonsContainer">
                <button class="yes-btn" id="yesButton">ايوا يروح ماما</button>
                <button class="no-btn" id="noButton">لا</button>
            </div>
        </div>
        
        <!-- قسم المعرض بدون إطار -->
        <div class="gallery-section" id="gallerySection">
            <div class="gallery-header">
                <img src="hug.gif" alt="Hug" class="hug-gif">
                <h2>بحبك يا قطوتي 💕</h2>
            </div>
            
            <div class="counter">
                عدد الصور: <span id="totalImages">18</span>
            </div>
            
            <div class="image-gallery-container" id="imageGalleryContainer">
                <div class="image-gallery" id="imageGallery">
                    <!-- سيتم إضافة الصور ديناميكياً -->
                </div>
            </div>
            
            <div class="page-footer">
                 <p>  كل ده معمول علشانك يك يطمرر بحبك يباردة ومتخافيش زاكرت</p>
                  
            </div>
            
            <button class="back-button" id="backButton">
                <i class="fas fa-arrow-right"></i> العودة للصفحة الاولة
            </button>
        </div>
    </div>
    
    <!-- عنصر الصوت (سيتم إخفاؤه) -->
    <audio id="backgroundMusic" loop preload="metadata">
        <source src="adiuo.mp3" type="audio/mpeg">
        المتصفح الخاص بك لا يدعم تشغيل الصوت.
    </audio>

    <script>
        // عناصر DOM
        const mainFrame = document.getElementById('mainFrame');
        const loginSection = document.getElementById('loginSection');
        const gallerySection = document.getElementById('gallerySection');
        const backgroundMusic = document.getElementById('backgroundMusic');
        const imageGallery = document.getElementById('imageGallery');
        const totalImagesSpan = document.getElementById('totalImages');
        const heartsBackground = document.getElementById('hearts-background');
        const backButton = document.getElementById('backButton');
        const yesButton = document.getElementById('yesButton');
        const noButton = document.getElementById('noButton');
        const buttonsContainer = document.getElementById('buttonsContainer');
        
        // متغيرات للأزرار
        let yesButtonSize = 1;
        let noClickCount = 0;
        let noButtonMoves = 0;
        const maxMoves = 10;
        
        // عدد الصور
        const TOTAL_IMAGES = 18;
        totalImagesSpan.textContent = TOTAL_IMAGES;
        
        let heartsInterval = null;
        
        // نظام القلوب المتساقطة - مبسط
        function initHearts() {
            heartsInterval = setInterval(() => {
                createHeart();
            }, 800);
        }
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            
            const left = Math.random() * 100;
            const size = Math.random() * 12 + 10;
            
            heart.style.left = `${left}%`;
            heart.style.fontSize = `${size}px`;
            
            heartsBackground.appendChild(heart);
            
            let top = -50;
            const speed = 0.5 + Math.random() * 0.3;
            const duration = 10000;
            
            const startTime = Date.now();
            
            function moveHeart() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                top = -50 + (progress * (window.innerHeight + 100));
                heart.style.top = `${top}px`;
                
                const swing = Math.sin(progress * Math.PI * 2) * 5;
                heart.style.transform = `translateX(${swing}px) rotate(${progress * 180}deg)`;
                
                heart.style.opacity = 1 - progress * 0.8;
                
                if (progress < 1) {
                    requestAnimationFrame(moveHeart);
                } else {
                    heart.remove();
                }
            }
            
            requestAnimationFrame(moveHeart);
            
            if (heartsBackground.children.length > 15) {
                const oldHearts = heartsBackground.querySelectorAll('.heart');
                if (oldHearts.length > 0) {
                    oldHearts[0].remove();
                }
            }
        }
        
        // زر "لا" يتحرك عند الضغط عليه
        noButton.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            noClickCount++;
            noButtonMoves++;
            
            // إذا وصلنا لعدد التحركات القصوى، نجعل زر "لا" يختفي
            if (noButtonMoves >= maxMoves) {
                noButton.style.opacity = '0';
                noButton.style.pointerEvents = 'none';
                
                // تكبير زر "ايوا يروح ماما" أكثر
                yesButtonSize += 0.5;
                yesButton.style.transform = `scale(${yesButtonSize})`;
                
                // عرض رسالة
                setTimeout(() => {
                    alert('مفيش فايدة! لازم تضغطي على "ايوا يروح ماما" 😄');
                }, 300);
                
                return;
            }
            
            // تأثير اهتزاز
            noButton.classList.add('moving');
            
            // تغيير لون الزر قليلاً
            noButton.style.backgroundColor = '#ff6b81';
            
            // حركة عشوائية داخل الحاوية
            const containerRect = buttonsContainer.getBoundingClientRect();
            const buttonRect = noButton.getBoundingClientRect();
            
            // حساب إحداثيات عشوائية داخل الحاوية
            const maxX = containerRect.width - buttonRect.width - 20;
            const maxY = containerRect.height - buttonRect.height - 20;
            
            // إذا كانت الشاشة صغيرة، نتحرك بشكل أقل
            const randomX = window.innerWidth < 480 ? 
                Math.random() * 50 * (Math.random() > 0.5 ? 1 : -1) : 
                Math.random() * maxX * (Math.random() > 0.5 ? 1 : -1);
            
            const randomY = window.innerWidth < 480 ? 
                Math.random() * 30 * (Math.random() > 0.5 ? 1 : -1) : 
                Math.random() * maxY * (Math.random() > 0.5 ? 1 : -1);
            
            // تطبيق الحركة
            noButton.style.transform = `translate(${randomX}px, ${randomY}px)`;
            
            // تكبير زر "ايوا يروح ماما"
            yesButtonSize += 0.1;
            yesButton.style.transform = `scale(${yesButtonSize})`;
            
            // إعادة لون الزر بعد فترة
            setTimeout(() => {
                noButton.style.backgroundColor = '#ff4757';
                noButton.classList.remove('moving');
            }, 800);
            
            // تغيير نص زر "لا" بعد عدة محاولات
            if (noClickCount === 3) {
                noButton.textContent = 'لا... بجد!';
            } else if (noClickCount === 5) {
                noButton.textContent = 'متدايقنيش يباردة!';
            } else if (noClickCount === 8) {
                noButton.textContent = 'خلاص بقى!';
            }
        });
        
        // زر "ايوا يروح ماما" - الدخول للمعرض
        yesButton.addEventListener('click', function() {
            // تأثير التكبير النهائي
            yesButtonSize += 0.3;
            yesButton.style.transform = `scale(${yesButtonSize})`;
            yesButton.style.backgroundColor = '#2e7d32';
            
            setTimeout(() => {
                loginSection.classList.add('hidden');
                mainFrame.classList.add('gallery-active');
                
                setTimeout(() => {
                    gallerySection.classList.add('active');
                    createImageGallery();
                    
                    setTimeout(() => {
                        backgroundMusic.play().catch(e => {
                            console.log("سيتم تشغيل الموسيقى يدوياً");
                        });
                    }, 500);
                }, 300);
            }, 500);
        });
        
        // عند الاقتراب من زر "لا" (للأجهزة التي تعمل بالماوس)
        noButton.addEventListener('mouseover', function() {
            if (noButtonMoves < maxMoves) {
                noButton.style.cursor = 'not-allowed';
                
                // حركة طفيفة عند الاقتراب
                noButton.style.transform = 'translateY(-2px)';
                
                setTimeout(() => {
                    noButton.style.transform = '';
                }, 200);
            }
        });
        
        // إنشاء معرض الصور بنظام بسيط
        function createImageGallery() {
            imageGallery.innerHTML = '';
            
            // إنشاء 18 صورة بالمسار القديم image1.jpg إلى image18.jpg
            for (let i = 1; i <= TOTAL_IMAGES; i++) {
                const imageItem = document.createElement('div');
                imageItem.className = 'gallery-image-item';
                
                const img = document.createElement('img');
                img.src = `image${i}.jpg`;
                img.alt = `صورة ${i}`;
                
                // إضافة الصورة للعنصر
                imageItem.appendChild(img);
                
                // إضافة العنصر للمعرض
                imageGallery.appendChild(imageItem);
            }
        }
        
        // زر العودة
        backButton.addEventListener('click', function() {
            gallerySection.classList.remove('active');
            mainFrame.classList.remove('gallery-active');
            
            setTimeout(() => {
                loginSection.classList.remove('hidden');
                backgroundMusic.pause();
                backgroundMusic.currentTime = 0;
                
                imageGallery.innerHTML = '';
                
                // إعادة تعيين الأزرار
                yesButtonSize = 1;
                yesButton.style.transform = 'scale(1)';
                yesButton.style.backgroundColor = '#4CAF50';
                
                noButton.style.transform = '';
                noButton.style.opacity = '1';
                noButton.style.pointerEvents = 'auto';
                noButton.style.backgroundColor = '#ff4757';
                noButton.textContent = 'لا';
                noButton.classList.remove('moving');
                
                noClickCount = 0;
                noButtonMoves = 0;
            }, 300);
        });
        
        // بدء تشغيل الخلفية
        window.addEventListener('DOMContentLoaded', () => {
            initHearts();
        });
        
        // تنظيف الموارد
        window.addEventListener('beforeunload', () => {
            clearInterval(heartsInterval);
            heartsBackground.innerHTML = '';
        });
    </script>
</body>
</html>
